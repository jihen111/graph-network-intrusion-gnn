data:
  path: data/raw/cic-generated-labelled-flows
  sample: 40000
  sample_seed: 17
  window_size: 2000
  window_seconds: 3600
split:
  train_fraction: 0.60
  validation_fraction: 0.20
model:
  hidden_channels: 32
  epochs: 8
  autoencoder_epochs: 8
  early_stopping_patience: 2
  learning_rate: 0.003
  weight_decay: 0.0001
experiments:
  seeds: [11, 23, 37]
  label_fractions: [0.01, 0.05, 0.10, 0.25, 1.0]
  run_ablation: true
  max_trees: 120
  output_dir: results
